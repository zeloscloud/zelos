[package]
name = "zelos"
version = "0.0.2"
edition = "2024"
description = "A distributed tracing system"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zeloscloud/zelos"
keywords = [
  "tracing",
  "distributed",
  "observability",
  "time-series",
  "visualization",
]
categories = ["development-tools", "asynchronous"]

[dependencies]
zelos-actions = { workspace = true }
zelos-proto = { workspace = true }
zelos-trace = { workspace = true }
zelos-trace-grpc = { workspace = true }
zelos-trace-types = { workspace = true }
anyhow = { workspace = true }
rand = { version = "0.8" }

# Dependencies for examples
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
