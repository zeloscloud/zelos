[package]
name = "zelos"
version = "0.0.2"
edition = "2024"
description = "A distributed tracing system"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zeloscloud/zelos"
keywords = [
  "tracing",
  "distributed",
  "observability",
  "time-series",
  "visualization",
]
categories = ["development-tools", "asynchronous"]

[dependencies]
zelos-actions = { workspace = true }
zelos-proto = { workspace = true }
zelos-trace = { workspace = true }
zelos-trace-grpc = { workspace = true }
zelos-trace-types = { workspace = true }

# Optional dependencies used only by examples.
anyhow = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
rand = { version = "0.8", optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "macros"] }
tokio-util = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[features]
default = []
examples = [
  "dep:anyhow",
  "dep:async-trait",
  "dep:rand",
  "dep:serde_json",
  "dep:tokio",
  "dep:tokio-util",
  "dep:tracing",
  "dep:tracing-subscriber",
]

[[example]]
name = "actions"
required-features = ["examples"]

[[example]]
name = "actions-advanced"
required-features = ["examples"]

[[example]]
name = "hello-world"
required-features = ["examples"]

[[example]]
name = "all-types"
required-features = ["examples"]

[[example]]
name = "async-emit"
required-features = ["examples"]

[[example]]
name = "async-schema"
required-features = ["examples"]

[[example]]
name = "basic-stream"
required-features = ["examples"]

[[example]]
name = "binary-payload"
required-features = ["examples"]

[[example]]
name = "burst-stream"
required-features = ["examples"]

[[example]]
name = "custom-timestamps"
required-features = ["examples"]

[[example]]
name = "event-schema-and-values"
required-features = ["examples"]

[[example]]
name = "grpc-publish-config"
required-features = ["examples"]

[[example]]
name = "high-frequency"
required-features = ["examples"]

[[example]]
name = "multi-sources"
required-features = ["examples"]

[[example]]
name = "publish-status"
required-features = ["examples"]

[[example]]
name = "sensor-array"
required-features = ["examples"]

[[example]]
name = "state-machine"
required-features = ["examples"]
